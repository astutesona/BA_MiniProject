<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | Business Sales Intelligence System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.3rem;">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <h4 class="fw-bold mb-1">Sales Intelligence & Revenue Analytics</h4>
            <div class="small text-muted">DBMS-Driven Business Intelligence Platform</div>
        </div>

        <div class="auth-body">
            <!-- Flash Alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }} small py-2 px-3 mb-3 alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user small"></i></span>
                        <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock small"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label small text-secondary" for="remember">Keep signed in</label>
                    </div>
                    <span class="small text-muted"><i class="fa-solid fa-shield-halved text-success me-1"></i>ACID Protected</span>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Authenticate Session
                </button>
            </form>

            <div class="mt-4 pt-3 border-top">
                <div class="small fw-semibold text-secondary mb-2 text-center">Development Demo Access:</div>
                <div class="d-flex flex-column gap-2">
                    <button type="button" class="demo-account-pill d-flex align-items-center justify-content-between" onclick="fillCredentials('admin', 'Admin@123')">
                        <div>
                            <span class="badge bg-danger me-1">Admin</span>
                            <strong>admin</strong>
                        </div>
                        <span class="text-muted small">Full DDL / DML / DCL / Console</span>
                    </button>

                    <button type="button" class="demo-account-pill d-flex align-items-center justify-content-between" onclick="fillCredentials('manager', 'Manager@123')">
                        <div>
                            <span class="badge bg-success me-1">Manager</span>
                            <strong>manager</strong>
                        </div>
                        <span class="text-muted small">BI Dashboards / Reports / Targets</span>
                    </button>

                    <button type="button" class="demo-account-pill d-flex align-items-center justify-content-between" onclick="fillCredentials('sales1', 'Sales@123')">
                        <div>
                            <span class="badge bg-primary me-1">Sales</span>
                            <strong>sales1</strong>
                        </div>
                        <span class="text-muted small">Orders / Customers / Transactions</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
